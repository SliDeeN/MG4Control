<!DOCTYPE html>
<!--
  Image d'aperçu des liens partagés (Open Graph / Twitter), 1200 × 630. Ce fichier n'est pas publié :
  « build.ps1 -Cards » l'ouvre dans un navigateur sans fenêtre, une fois par langue (?lang=fr|en), et
  en tire docs/assets/img/og-fr.png et og-en.png. La maquette est la vraie, montée par sim.js : l'image
  suit donc l'application, il suffit de relancer la commande après un changement visible.
  site.css n'est pas chargé exprès : ses classes (.card, .brand…) s'appliqueraient ici.
-->
<html lang="fr" data-lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>MG4Control : image de partage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=Roboto:wght@400;500;700&display=block" rel="stylesheet">
  <link rel="stylesheet" href="../docs/assets/css/sim.css">
  <script>
    /* Langue posée avant le montage de la maquette, qui la lit. */
    (function () {
      var l = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'fr';
      document.documentElement.lang = l;
      document.documentElement.setAttribute('data-lang', l);
    })();
  </script>
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0B0B0D; }
    html[data-lang="fr"] [data-l="en"], html[data-lang="en"] [data-l="fr"] { display: none; }
    .og-card {
      position: relative; width: 1200px; height: 630px; overflow: hidden; box-sizing: border-box;
      display: flex; flex-direction: column; align-items: center;
      color: #F2F3F5; font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(760px 340px at 14% 6%, rgba(56, 189, 248, .22), transparent 70%),
        radial-gradient(680px 320px at 90% 0%, rgba(229, 57, 53, .16), transparent 70%),
        #0B0B0D;
    }
    .og-brand { display: flex; align-items: center; gap: 20px; margin-top: 34px; }
    .og-brand img { width: 76px; height: 76px; border-radius: 19px; }
    .og-brand b { font-size: 72px; font-weight: 800; letter-spacing: -.035em; line-height: 1; }
    .og-brand .four { color: #E53935; }
    .og-tag { margin: 12px 0 0; font-size: 38px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; }
    .og-shot { width: 1000px; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="og-card">
    <div class="og-brand"><img src="../docs/assets/img/icon-180.png" alt=""><b>MG<span class="four">4</span>Control</b></div>
    <p class="og-tag"><span data-l="fr">Réglages avancés pour la MG4 Electric</span><span data-l="en">Advanced settings for the MG4 Electric</span></p>
    <div class="og-shot" id="sim"></div>
  </div>
  <script src="../docs/assets/js/strings.js"></script>
  <script src="../docs/assets/js/sim.js"></script>
  <script>MG4Sim.mount(document.getElementById('sim'), { screen: 'dashboard', tab: 0 });</script>
</body>
</html>
